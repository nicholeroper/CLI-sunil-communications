<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sunil Communication</title>
    <script>
      // GitHub Pages single-page app fallback: converts ?/path back to /path
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
          l.replace(l.pathname.slice(0, -1) + decoded + l.hash);
        } else {
          l.replace('/');
        }
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
